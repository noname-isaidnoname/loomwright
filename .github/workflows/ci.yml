name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang is the reference compiler; GCC stays supported. Clang 19 is
          # the first Clang that exposes std::expected with libstdc++ 13.
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
          - compiler: gcc
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          common=(
            ninja-build ccache libx11-dev libxcb1-dev libpng-dev libgtk-3-dev libwayland-dev
            xvfb xauth xfonts-base xdotool imagemagick weston
          )
          if [[ $CXX == clang++-19 ]]; then
            compiler=(clang-19 lld llvm-19 llvm-19-tools)
          else
            compiler=()
          fi
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            "${common[@]}" "${compiler[@]}"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-24.04-${{ matrix.compiler }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-24.04-${{ matrix.compiler }}-ccache-
      - run: make JOBS=2
      - name: Report the compiler
        run: ${CXX} --version
